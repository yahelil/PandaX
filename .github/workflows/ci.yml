name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:dashboard
      - run: npm run build:dashboard
      - run: npm run test:e2e --workspace @pandax/dashboard

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: actis
          POSTGRES_PASSWORD: actis
          POSTGRES_DB: actis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U actis -d actis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest apps/engine/tests -m "not slow" -q
        env:
          PYTHONPATH: apps/engine
          PANDAX_TEST_POSTGRES_URL: postgresql+psycopg://actis:actis@localhost:5432/actis_test
      - run: docker build --tag actis-api:ci .
