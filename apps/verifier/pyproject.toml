[project]
name = "pandax-evidence-verifier"
version = "0.1.0"
description = "Independent offline verifier for PandaX evidence bundles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pandax-verify = "pandax_verifier.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pandax_verifier"]

